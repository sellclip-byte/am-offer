<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit community post | am-offer.net</title><style>body{font-family:Arial;background:#eee;margin:0}.w{max-width:820px;margin:auto;padding:30px}label{display:block;font-weight:bold;margin-top:16px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #aaa;font:inherit}textarea{min-height:180px}button{margin-top:20px;background:#111;color:#fff;border:0;padding:12px 22px;font-weight:bold}a{color:#111}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="am-offer-auth-v1.js"></script></head><body><main class="w"><a href="am-offer-net-my-listings-v1.html">← My Listings</a><h1>Edit community post</h1><form id="f"><label>Section</label><select id="section"><option>lost</option><option>found</option><option>alerts</option><option>general</option><option>local news</option><option>help from neighbors</option></select><label>Title</label><input id="title" required><label>State</label><input id="state" required><label>City</label><input id="city" required><label>Details</label><textarea id="details" required></textarea><button>Save changes</button></form><p id="msg"></p></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),ctx=await AmOfferAuth.requireActiveMember(location.pathname+location.search);if(!ctx||!id)return;const {data,error}=await ctx.client.from('community_posts').select('*').eq('id',id).eq('user_id',ctx.user.id).single();if(error||!data){msg.textContent='Post not found.';f.style.display='none';return}for(const k of ['section','title','state','city','details'])document.getElementById(k).value=data[k]||'';f.onsubmit=async e=>{e.preventDefault();const payload={};for(const k of ['section','title','state','city','details'])payload[k]=document.getElementById(k).value.trim();const r=await ctx.client.from('community_posts').update(payload).eq('id',id).eq('user_id',ctx.user.id);if(r.error){msg.textContent='Could not save: '+r.error.message;return}location.href='am-offer-net-community-post-detail-v1.html?id='+encodeURIComponent(id)}})();</script></body></html>
