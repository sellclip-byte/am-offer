<script id="compare-dynamic-v50">
function get(){return AmOfferListings.cleanSelection('amOfferCompare')}
function set(a){try{localStorage.setItem('amOfferCompare',JSON.stringify(a.map(String).slice(0,3)))}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(v){return String(v??'').trim().toLowerCase()}
function comparableValue(x,key){
 if(key==='condition') return x.condition||'Not specified';
 if(key==='category') return x.category||'Listing';
 if(key==='location') return AmOfferListings.locationText(x)||'Not specified';
 if(key==='price') return x.price==null?'Make Offer':String(Number(x.price));
 if(key==='summary') return x.desc||'No description provided.';
 return '';
}
function differingKeys(chosen){
 const keys=['condition','category','location','price','summary'];
 const out=new Set();
 keys.forEach(k=>{const vals=chosen.map(x=>norm(comparableValue(x,k)));if(new Set(vals).size>1)out.add(k)});
 return out;
}
function applyDifferenceMode(chosen){
 const only=document.getElementById('differencesOnly').checked;
 const diffs=differingKeys(chosen);
 document.querySelectorAll('[data-compare-row]').forEach(row=>{
   const key=row.dataset.compareRow;
   row.classList.toggle('same-row',only && !diffs.has(key));
 });
}
function render(){
 const ids=get(),chosen=ids.map(id=>AmOfferListings.byId(id)).filter(Boolean),g=document.getElementById('compareGrid'),empty=document.getElementById('empty');
 document.getElementById('compareCount').textContent=`${chosen.length} of 3 selected`;
 document.getElementById('compareTools').style.display=chosen.length?'flex':'none';
 g.innerHTML='';empty.hidden=chosen.length>0;if(!chosen.length)return;
 const fixed=chosen.filter(x=>x.price!=null && Number.isFinite(Number(x.price))).map(x=>Number(x.price));
 const minPrice=fixed.length?Math.min(...fixed):null;
 chosen.forEach(x=>{
   const isBest=minPrice!=null && x.price!=null && Number(x.price)===minPrice;
   const c=document.createElement('article');c.className='card'+(isBest?' bestprice':'');
   c.innerHTML=`<div class="photo"><img src="${esc(x.pic)}" alt="${esc(x.title)}"></div><div class="body"><div class="price">${esc(x.price==null?'Make Offer':'$'+Number(x.price).toLocaleString())}${isBest?'<span class="bestbadge">Lowest price</span>':''}</div><div class="title">${esc(x.title)}</div><div class="meta">${esc(AmOfferListings.locationText(x))}</div><div class="row" data-compare-row="condition"><b>Condition</b><span>${esc(x.condition||'Not specified')}</span></div><div class="row" data-compare-row="category"><b>Category</b><span>${esc(x.category||'Listing')}</span></div><div class="row" data-compare-row="location"><b>Location</b><span>${esc(AmOfferListings.locationText(x)||'Not specified')}</span></div><div class="row" data-compare-row="price"><b>Price</b><span>${esc(AmOfferListings.priceOnly(x))}</span></div><div class="row" data-compare-row="summary"><b>Summary</b><span>${esc(x.desc||'No description provided.')}</span></div><div class="actions"><a class="primary" href="am-offer-net-listing-detail-v12.html?listing=${encodeURIComponent(x.id)}&return=${encodeURIComponent('am-offer-net-compare-v1.html')}">View listing</a><button type="button" data-remove="${esc(x.id)}">Remove</button></div></div>`;
   g.appendChild(c)
 });
 g.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{set(get().filter(id=>id!==b.dataset.remove));render()});
 applyDifferenceMode(chosen);
}
document.getElementById('clearAll').onclick=()=>{set([]);render()};
document.getElementById('differencesOnly').onchange=()=>{const chosen=get().map(id=>AmOfferListings.byId(id)).filter(Boolean);applyDifferenceMode(chosen)};
render();window.addEventListener('storage',render);
</script>
<script id="nav-count-script-v112">
(async function(){
  function read(k){try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}}
  function set(name,n){document.querySelectorAll('[data-state-count="'+name+'"]').forEach(el=>el.textContent=String(n||0))}
  async function sync(){
    set('hidden',read('amOfferHidden').length);
    set('compare',read('amOfferCompare').length);
    let fav=read('amOfferFavorites').length;
    try{
      const client=AmOfferAuth.client();
      const {data:{session}}=await client.auth.getSession();
      if(session){
        const {count,error}=await client.from('favorites').select('*',{count:'exact',head:true}).eq('user_id',session.user.id);
        if(!error&&Number.isInteger(count))fav=count;
      }
    }catch(_e){}
    set('fav',fav);
  }
  sync();
  window.addEventListener('storage',sync);
  window.addEventListener('focus',sync);
  setInterval(sync,15000);
})();
</script>

<script id="global-auth-nav-v99">
(function(){
  async function run(){
    let client;
    try{ client=AmOfferAuth.client(); }catch(_e){ return; }

    let session=null;
    try{
      const r=await client.auth.getSession();
      session=r && r.data ? r.data.session : null;
    }catch(_e){ return; }

    const loginLinks=[...document.querySelectorAll('a[href*="am-offer-net-sign-in-v1.html"]')];
    const createLinks=[...document.querySelectorAll('a[href*="am-offer-net-create-account-v1.html"]')];

    if(!session) return;

    loginLinks.forEach(a=>{
      const t=(a.textContent||'').trim().toLowerCase();
      if(t==='log in' || t==='login' || t==='sign in') a.style.display='none';
    });
    createLinks.forEach(a=>{
      const t=(a.textContent||'').trim().toLowerCase();
      if(t==='create account' || t==='sign up' || t==='signup') a.style.display='none';
    });

    const nav=document.querySelector('header .topnav, header .links, header nav, .topnav');
    if(nav && !document.querySelector('.auth-nav-signout-v99')){
      const out=document.createElement('a');
      out.href='#';
      out.className='auth-nav-signout-v99';
      out.textContent='Sign out';
      out.style.cursor='pointer';
      out.addEventListener('click',async function(e){
        e.preventDefault();
        try{await client.auth.signOut();}catch(_e){}
        location.href='index.html';
      });
      nav.appendChild(out);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run);
  else run();
})();
</script>
