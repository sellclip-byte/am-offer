<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit reflection | am-offer.net</title><style>body{font-family:Arial;background:#eee;margin:0}.w{max-width:820px;margin:auto;padding:30px}label{display:block;font-weight:bold;margin-top:16px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #aaa;font:inherit}textarea{min-height:220px}button{margin-top:20px;background:#111;color:#fff;border:0;padding:12px 22px;font-weight:bold}a{color:#111}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="am-offer-auth-v1.js"></script></head><body><main class="w"><a href="am-offer-net-my-listings-v1.html">← My Listings</a><h1>Edit reflection</h1><form id="f"><label>Topic</label><input id="topic" required><label>Reflection</label><textarea id="body" required></textarea><button>Save changes</button></form><p id="msg"></p></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),ctx=await AmOfferAuth.requireActiveMember(location.pathname+location.search);if(!ctx||!id)return;const {data,error}=await ctx.client.from('reflections').select('*').eq('id',id).eq('author_id',ctx.user.id).single();if(error||!data){msg.textContent='Reflection not found.';f.style.display='none';return}topic.value=data.topic||'';body.value=data.body||'';f.onsubmit=async e=>{e.preventDefault();const r=await ctx.client.from('reflections').update({topic:topic.value.trim(),body:body.value.trim()}).eq('id',id).eq('author_id',ctx.user.id);if(r.error){msg.textContent='Could not save: '+r.error.message;return}location.href='am-offer-net-reflection-detail-v1.html?id='+encodeURIComponent(id)}})();</script></body></html>
