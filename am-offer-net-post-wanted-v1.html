<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post a WANTED Ad | am-Offer.net</title><style>
*{box-sizing:border-box}body{margin:0;background:#ededeb;color:#151515;font-family:Arial,sans-serif}.top{background:#fff;border-bottom:1px solid #ccc;padding:13px 4%;display:flex;justify-content:space-between}.top a{text-decoration:none;color:#111;font-weight:800}.hero{background:linear-gradient(105deg,#3d0707,#851414,#4c0909);color:#fff;padding:24px 5%;border-bottom:4px solid #a91515}.hero h1{margin:0;font-size:38px}.hero p{margin:5px 0 0}.panel{max-width:1000px;margin:28px auto;background:#fff;border:1px solid #c8c8c8;box-shadow:0 5px 18px #00000012;padding:28px}.row{margin-bottom:22px}label{display:block;font-weight:800;margin-bottom:7px}input,textarea{width:100%;border:1px solid #aaa;padding:13px;font:16px Arial;border-radius:3px}textarea{min-height:170px;resize:vertical}.photos{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.slot{height:92px;border:1px dashed #999;background:#f7f7f7;display:flex;align-items:center;justify-content:center;font-size:25px;color:#777;overflow:hidden}.slot img{width:100%;height:100%;object-fit:cover}.upload{display:inline-block;padding:10px 15px;border:1px solid #999;background:#f6f6f6;cursor:pointer;font-weight:700}.submit{width:100%;background:#a91515;color:#fff;border:0;padding:15px;font-size:18px;font-weight:900;border-radius:4px;cursor:pointer}.note{font-size:13px;color:#555;margin-top:7px}.status{margin:12px 0;font-weight:700}@media(max-width:700px){.panel{margin:15px;padding:18px}.photos{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:30px}}
</style></head><body><header class="top"><b>am-Offer.net</b><a href="am-offer-net-wanted-v1.html">WANTED</a></header>
<section class="hero"><h1>⌕ Post a WANTED Ad</h1><p>Describe it. Show it. Let people who have it find you.</p></section>
<main class="panel"><div class="row"><label>Title *</label><input id="title" maxlength="120" placeholder="What are you looking for?"></div>
<div class="row"><label>Description *</label><textarea id="description" maxlength="4000" placeholder="Write what you want. Add any details that matter to you."></textarea></div>
<div class="row"><label>Photos (optional)</label><label class="upload">Choose photos<input id="photos" type="file" accept="image/*" multiple hidden></label><div class="note">Up to 12 photos. Photos can show examples of what you are looking for.</div><div id="preview" class="photos" style="margin-top:12px"></div></div>
<div id="status" class="status"></div><button class="submit" id="publish">⌕ Post WANTED Ad</button></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const U='https://rryehtaskbjnfbodymjj.supabase.co';
const K='sb_publishable_10LgFmHximAplWyQXKNopw_2peqDb7r';
const sb=supabase.createClient(U,K);
let files=[],user=null,editId=new URLSearchParams(location.search).get('edit'),existingImages=[];
const inp=document.getElementById('photos'),pre=document.getElementById('preview'),st=document.getElementById('status');

function renderPreview(){
 pre.innerHTML=[
   ...existingImages.map(u=>`<div class="slot"><img src="${u}"></div>`),
   ...files.map(f=>`<div class="slot"><img src="${URL.createObjectURL(f)}"></div>`)
 ].slice(0,12).join('');
}
inp.addEventListener('change',()=>{
 const incoming=[...inp.files];
 const room=Math.max(0,12-existingImages.length-files.length);
 files.push(...incoming.slice(0,room));
 inp.value='';
 renderPreview();
 st.textContent=incoming.length>room?'Maximum 12 photos.':'';
});

async function currentUser(){
 const {data:{session}}=await sb.auth.getSession();
 if(session?.user)return session.user;
 const {data:{user}}=await sb.auth.getUser();
 return user||null;
}
async function init(){
 user=await currentUser();
 if(!user){st.textContent='Please sign in.';return}
 st.textContent='';
 if(editId){
   const r=await sb.from('wanted_posts').select('*').eq('id',editId).single();
   if(r.error){st.textContent='This WANTED ad cannot be edited.';return}
   document.getElementById('title').value=r.data.title||'';
   document.getElementById('description').value=r.data.description||'';
   existingImages=(r.data.image_urls||[]).slice(0,12);
   renderPreview();
   document.getElementById('publish').textContent='Save WANTED Ad';
 }
}
document.getElementById('publish').onclick=async()=>{
 user=user||await currentUser();
 if(!user){
   location.href='am-offer-net-sign-in-v1.html?return='+encodeURIComponent('am-offer-net-post-wanted-v1.html'+(editId?'?edit='+editId:''));
   return;
 }
 const title=document.getElementById('title').value.trim(),description=document.getElementById('description').value.trim();
 if(!title||!description){st.textContent='Please add a title and description.';return}
 st.textContent=editId?'Saving…':'Publishing…';
 let urls=[...existingImages];
 for(const f of files.slice(0,12-urls.length)){
   const ext=(f.name.split('.').pop()||'jpg').toLowerCase();
   const path=`${user.id}/wanted/${crypto.randomUUID()}.${ext}`;
   const up=await sb.storage.from('listing-media').upload(path,f,{upsert:false,contentType:f.type||undefined});
   if(up.error){st.textContent='Photo upload failed: '+up.error.message;return}
   urls.push(sb.storage.from('listing-media').getPublicUrl(path).data.publicUrl);
 }
 const payload={title,description,image_urls:urls.slice(0,12),updated_at:new Date().toISOString()};
 let r=editId
   ? await sb.from('wanted_posts').update(payload).eq('id',editId)
   : await sb.from('wanted_posts').insert({user_id:user.id,title,description,image_urls:payload.image_urls,status:'published'});
 if(r.error){st.textContent='Could not save: '+r.error.message;return}
 location.href='am-offer-net-wanted-v1.html';
};
init();
</script></body></html>
