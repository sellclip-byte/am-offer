</style></head><body><header class="top"><b>am-Offer.net</b><a href="am-offer-net-wanted-v1.html">← Back to WANTED</a></header><section class="hero"><h1>⌕ WANTED</h1></section><main class="wrap"><article class="sheet" id="view"><b>Loading…</b></article></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://rryehtaskbjnfbodymjj.supabase.co','sb_publishable_10LgFmHximAplWyQXKNopw_2peqDb7r');const id=new URLSearchParams(location.search).get('id');let row,user,isAdmin=false;
const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){user=(await sb.auth.getUser()).data.user||null;if(user){const a=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!a.data}const r=await sb.from('wanted_posts').select('*').eq('id',id).single();if(r.error){document.getElementById('view').innerHTML='<h2>WANTED ad not found.</h2>';return}row=r.data;const imgs=row.image_urls||[];const gallery=imgs.length?`<div class="mainpic"><img id="mainWantedPic" src="${imgs[0]}"></div><div class="thumbs">${imgs.map(u=>`<button class="thumb" onclick="document.getElementById('mainWantedPic').src='${u}'"><img src="${u}"></button>`).join('')}</div>`:'';const can=user&&(user.id===row.user_id||isAdmin);document.getElementById('view').innerHTML=`<span class="badge">⌕ WANTED</span><h2>${esc(row.title)}</h2>${gallery}<div class="desc">${esc(row.description)}</div>${can?`<div class="actions"><a href="am-offer-net-post-wanted-v1.html?edit=${row.id}">Edit</a><button class="danger" onclick="del()">Delete</button></div>`:''}`;}
async function del(){if(!confirm('Delete this WANTED ad?'))return;const r=await sb.from('wanted_posts').delete().eq('id',id);if(r.error){alert(r.error.message);return}location.href='am-offer-net-wanted-v1.html'}init();
