<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Create an account | am-Offer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ddd;font-family:Arial,Helvetica,sans-serif}
.page{position:relative;width:100vw;height:100vh;background:url("am-offer-net-auth-approved-exact.png") center center/100% 100% no-repeat}
.hot{position:absolute;background:transparent;border:0;outline:0}
#home{left:1.2%;top:1.6%;width:14.1%;height:5.4%;cursor:pointer}
#email{left:60.7%;top:39.3%;width:31.9%;height:7.2%;padding:0 1.4% 0 5%;font-size:clamp(14px,1.25vw,21px);color:#111}
#password{left:60.7%;top:49.0%;width:31.9%;height:7.2%;padding:0 1.4% 0 5%;font-size:clamp(14px,1.25vw,21px);color:#111}
#create{left:60.7%;top:58.4%;width:31.9%;height:6.6%;cursor:pointer}
#loginLink{left:67.4%;top:70.9%;width:19.3%;height:4.4%;cursor:pointer}
#status{position:absolute;left:60.7%;top:76.0%;width:31.9%;text-align:center;font-size:14px;color:#111}
@media(max-width:700px){
 html,body{overflow:auto;background:#f4f4f4;height:auto;min-height:100%;color:#111}
 .page{width:100%;height:auto;min-height:100vh;background:none!important;padding:24px 18px 40px;display:flex;flex-direction:column;align-items:center}
 #home{position:relative;left:auto;top:auto;width:100%;max-width:430px;height:auto;background:#111;color:#fff!important;padding:11px 14px;border-radius:8px;text-decoration:none;font-weight:700;margin-bottom:22px}
 #home:after{content:'⌂  Back to Home'}
 #signup{width:100%;max-width:430px;background:#fff;border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.14);padding:28px 20px 24px;display:flex;flex-direction:column;gap:16px}
 #signup:before{content:'Create account';display:block;text-align:center;font-size:30px;font-weight:800;margin-bottom:8px}
 #email,#password,#create{position:relative;left:auto;top:auto;width:100%;height:58px}
 #email,#password{padding:0 16px;font-size:18px;border:1px solid #aaa;border-radius:6px;background:#fff}
 #create{background:#111;color:#fff;border:0;border-radius:6px;font-size:19px;font-weight:800;cursor:pointer}
 #create:after{content:'Create account'}
 #loginLink{position:relative;left:auto;top:auto;width:100%;max-width:430px;height:auto;text-align:center;margin-top:22px;color:#111!important;text-decoration:underline;font-size:17px}
 #loginLink:after{content:'Already have an account? Log in'}
 #status{position:relative;left:auto;top:auto;width:100%;max-width:430px;margin-top:16px;text-align:center;font-size:15px;line-height:1.45}
}
</style>
<meta content="noindex, nofollow, noarchive" name="robots"/></head>
<body>
<main class="page">
<a aria-label="Back to Home" class="hot" href="index.html" id="home"></a>
<form id="signup">
<input aria-label="Email" autocomplete="email" class="hot" id="email" required="" type="email"/>
<input aria-label="Password" autocomplete="new-password" class="hot" id="password" minlength="8" required="" type="password"/>
<button aria-label="Create account" class="hot" id="create" type="submit"></button>
</form>
<a aria-label="Log in" class="hot" href="am-offer-net-sign-in-v1.html" id="loginLink"></a>
<div aria-live="polite" id="status" role="status"></div>
</main>
<script>
const SUPABASE_URL='https://rryehtaskbjnfbodymjj.supabase.co';
const SUPABASE_KEY='sb_publishable_10LgFmHximAplWyQXKNopw_2peqDb7r';
document.getElementById('signup').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const status=document.getElementById('status');
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  status.textContent='';
  if(!email || password.length<8){status.textContent='Enter a valid email and a password of at least 8 characters.';return;}
  try{
    const r=await fetch(SUPABASE_URL+'/functions/v1/membership-signup',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
      body:JSON.stringify({email,password})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||data.message||'Unable to create account.');
    status.textContent='Account created successfully. Opening Post my chance ad…';
    setTimeout(()=>{ location.href='am-offer-net-post-my-chance-ad-v4.html?new=1'; },350);
  }catch(err){status.textContent=err?.message||'Unable to create account.';}
});
</script>
<script src="am-offer-nav-cleanup-v138.js"></script>
</body>
</html>
