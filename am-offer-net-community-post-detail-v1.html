<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post | am-offer.net</title><style>body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#111}.wrap{max-width:900px;margin:0 auto;padding:24px}.brand{font-size:28px;font-weight:800;margin-bottom:22px}.back{display:inline-block;margin-bottom:18px;color:#0645d8}.card{background:#fff;border:1px solid #bbb;padding:24px}.card h1{margin:0 0 10px;font-size:30px}.meta{color:#555;font-size:14px;margin-bottom:22px}.body{white-space:pre-wrap;font-size:18px;line-height:1.55}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 22px}.photos img{width:100%;max-height:520px;object-fit:contain;background:#f4f4f4;border:1px solid #bbb;cursor:pointer}.photo-viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:24px;z-index:9999}.photo-viewer.open{display:flex}.photo-viewer img{max-width:96vw;max-height:92vh;object-fit:contain}.photo-viewer button{position:absolute;top:18px;right:18px;font-size:24px;background:#fff;border:0;padding:8px 13px;cursor:pointer}.note{padding:20px;background:#fff;border:1px solid #bbb}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="am-offer-auth-v1.js"></script></head><body><div class="wrap"><div class="brand">am-offer.net</div><a class="back" href="am-offer-net-community-v2.html">← Back to community</a><main id="post" class="note">Loading post…</main></div><div id="photoViewer" class="photo-viewer"><button type="button" aria-label="Close photo">×</button><img alt="Community post photo"></div><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),box=document.getElementById('post');function e(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}if(!id){box.textContent='Post not found.';return}try{const c=AmOfferAuth.client();const {data,error}=await c.from('community_posts').select('id,section,title,state,city,details,created_at,image_paths').eq('id',id).single();if(error||!data)throw error||new Error();const when=new Date(data.created_at).toLocaleString();box.className='card';let paths=data.image_paths;if(typeof paths==='string'){try{paths=JSON.parse(paths)}catch(_){paths=[]}}if(!Array.isArray(paths))paths=[];paths=paths.filter(Boolean);const photos=paths.map((p,i)=>{const u=c.storage.from('listing-media').getPublicUrl(p).data.publicUrl;return '<img src="'+e(u)+'" alt="Post photo '+(i+1)+'" data-full="'+e(u)+'">'}).join('');box.innerHTML='<h1>'+e(data.title)+'</h1><div class="meta">'+e(data.section)+' • '+e(data.city)+', '+e(data.state)+' • '+e(when)+'</div>'+(photos?'<div class="photos">'+photos+'</div>':'')+'<div class="body">'+e(data.details)+'</div>';document.title=data.title+' | am-offer.net';const viewer=document.getElementById('photoViewer'),viewerImg=viewer.querySelector('img');box.querySelectorAll('.photos img').forEach(img=>img.addEventListener('click',()=>{viewerImg.src=img.dataset.full||img.src;viewer.classList.add('open')}));viewer.querySelector('button').onclick=()=>viewer.classList.remove('open');viewer.addEventListener('click',ev=>{if(ev.target===viewer)viewer.classList.remove('open')})}catch(_){box.textContent='This community post is unavailable.'}})();</script></body></html>
