<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Reset Password | am-Offer</title>
<link href="favicon-32x32.png" rel="icon"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ddd;font-family:Arial,Helvetica,sans-serif;color:#111}
.page{position:relative;width:100vw;height:100vh;background:url("am-offer-net-auth-approved-exact.png") center center/100% 100% no-repeat}
#home{position:absolute;left:1.2%;top:1.6%;width:14.1%;height:5.4%;background:transparent;border:0;cursor:pointer}
.card{position:absolute;left:57.55%;top:20.7%;width:38.35%;height:58.9%;background:#fff;border-radius:16px;box-shadow:0 18px 48px rgba(0,0,0,.20);padding:5.2vh 3vw 3.5vh;display:flex;flex-direction:column;justify-content:center}
h1{text-align:center;font-size:clamp(28px,2.25vw,39px);margin:0 0 3.5vh}
.field{position:relative;margin-bottom:2.2vh}
.field input{width:100%;height:7vh;min-height:54px;border:1px solid #b8b8b8;border-radius:5px;padding:0 18px 0 72px;font-size:clamp(16px,1.2vw,20px);outline:none;background:#fff}
.field:before{content:'🔒';position:absolute;left:25px;top:50%;transform:translateY(-50%);font-size:22px;color:#666;z-index:2}
.primary{width:100%;height:6.5vh;min-height:54px;border:0;border-radius:4px;background:#111;color:#fff;font-size:clamp(18px,1.3vw,22px);font-weight:700;cursor:pointer}
.msg{text-align:center;margin-top:2.5vh;font-size:clamp(13px,1vw,16px);line-height:1.45;color:#555;min-height:2.8em}
.links{text-align:center;margin-top:2.5vh;padding-top:2.2vh;border-top:1px solid #d4d4d4;font-size:clamp(14px,1.05vw,17px)}
.links a{color:#111}
@media(max-width:700px){html,body{overflow:auto}.page{min-width:900px;min-height:600px}}
</style>
<meta content="noindex, nofollow, noarchive" name="robots"/></head>
<body>
<main class="page">
<a aria-label="Back to Home" href="index.html" id="home"></a>
<section class="card">
<h1>Choose a new password</h1>
<form id="resetForm">
<div class="field"><input autocomplete="new-password" id="p1" minlength="8" placeholder="New password" required="" type="password"/></div>
<div class="field"><input autocomplete="new-password" id="p2" minlength="8" placeholder="Confirm new password" required="" type="password"/></div>
<button class="primary" type="submit">Update Password</button>
</form>
<div class="msg" id="msg">Open this page from the secure reset link sent to your email.</div>
<div class="links"><a href="am-offer-net-sign-in-v1.html"><b>Back to Log in</b></a></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="am-offer-auth-v1.js"></script>
<script src="am-offer-message-indicator-v138.js"></script>
<script>
(function(){
  const msg=document.getElementById('msg');
  const p1=document.getElementById('p1'),p2=document.getElementById('p2');
  document.getElementById('resetForm').addEventListener('submit',async function(e){
    e.preventDefault();
    const a=p1.value,b=p2.value;
    if(a.length<8){msg.textContent='Password must be at least 8 characters.';return;}
    if(a!==b){msg.textContent='Passwords do not match.';return;}
    const btn=this.querySelector('button');btn.disabled=true;const old=btn.textContent;btn.textContent='Updating…';
    try{
      const c=AmOfferAuth.client();
      const {data:{session}}=await c.auth.getSession();
      if(!session)throw new Error('This reset link is no longer active. Request a new one.');
      const {error}=await c.auth.updateUser({password:a});
      if(error)throw error;
      msg.textContent='Password updated. You can now log in with your new password.';
      setTimeout(()=>location.href='am-offer-net-sign-in-v1.html',1400);
    }catch(err){msg.textContent=err?.message||'Unable to update password.';btn.disabled=false;btn.textContent=old;}
  });
})();
</script>
<script src="am-offer-nav-cleanup-v138.js"></script>
</body>
</html>
