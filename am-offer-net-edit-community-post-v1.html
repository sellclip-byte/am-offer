<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Community Post | am-offer.net</title><style>body{font-family:Arial;margin:0;background:#eee;color:#111}.wrap{max-width:760px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #bbb;padding:24px}label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #aaa;font:16px Arial}textarea{min-height:180px}button{margin-top:18px;background:#111;color:#fff;border:0;padding:12px 20px;font-weight:700}.back{color:#0645d8}.msg{margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="am-offer-auth-v1.js"></script></head><body><div class="wrap"><a class="back" href="am-offer-net-my-listings-v1.html">← My Listings</a><div class="card"><h1>Edit community post</h1><form id="f"><label>Section</label><select id="section"><option>lost</option><option>found</option><option>alerts</option><option>general</option><option>local news</option><option>help from neighbors</option></select><label>Title</label><input id="title" required><label>State</label><input id="state" required><label>City</label><input id="city" required><label>Details</label><textarea id="details" required></textarea><button>Save changes</button><div id="msg" class="msg"></div></form></div></div><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),ctx=await AmOfferAuth.requireActiveMember(location.pathname.split('/').pop()+location.search);if(!ctx||!id)return;const c=ctx.client,u=ctx.user,{data,error}=await c.from('community_posts').select('*').eq('id',id).eq('user_id',u.id).single();if(error||!data){document.getElementById('msg').textContent='Post not found.';return}for(const k of ['section','title','state','city','details'])document.getElementById(k).value=data[k]||'';document.getElementById('f').onsubmit=async e=>{e.preventDefault();const payload={section:section.value,title:title.value.trim(),state:state.value.trim(),city:city.value.trim(),details:details.value.trim()};const r=await c.from('community_posts').update(payload).eq('id',id).eq('user_id',u.id);msg.textContent=r.error?r.error.message:'Saved successfully.'}})();</script></body></html>
