<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Forgot Password | am-Offer</title>
<link href="favicon-32x32.png" rel="icon"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ddd;font-family:Arial,Helvetica,sans-serif;color:#111}
.page{position:relative;width:100vw;height:100vh;background:url("am-offer-net-auth-approved-exact.png") center center/100% 100% no-repeat}
#home{position:absolute;left:1.2%;top:1.6%;width:14.1%;height:5.4%;background:transparent;border:0;cursor:pointer}
.card{position:absolute;left:57.55%;top:20.7%;width:38.35%;height:58.9%;background:#fff;border-radius:16px;box-shadow:0 18px 48px rgba(0,0,0,.20);padding:7.2vh 3vw 4vh;display:flex;flex-direction:column;justify-content:center}
h1{text-align:center;font-size:clamp(28px,2.25vw,39px);margin:0 0 2vh}
.sub{text-align:center;font-size:clamp(14px,1.05vw,17px);line-height:1.5;color:#555;margin:0 auto 4.5vh;max-width:90%}
.field{position:relative;margin-bottom:2.5vh}
.field input{width:100%;height:7vh;min-height:54px;border:1px solid #b8b8b8;border-radius:5px;padding:0 18px 0 72px;font-size:clamp(16px,1.25vw,21px);outline:none;background:#fff}
.field:before{content:'✉';position:absolute;left:24px;top:50%;transform:translateY(-50%);font-size:28px;color:#666;z-index:2}
.primary{width:100%;height:6.5vh;min-height:54px;border:0;border-radius:4px;background:#111;color:#fff;font-size:clamp(18px,1.35vw,23px);font-weight:700;cursor:pointer}
.links{text-align:center;margin-top:4vh;padding-top:2.5vh;border-top:1px solid #d4d4d4;font-size:clamp(14px,1.05vw,17px)}
.links a{color:#111}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 17px;border-radius:4px;display:none;z-index:20;max-width:90vw;text-align:center}
@media(max-width:700px){html,body{overflow:auto}.page{min-width:900px;min-height:600px}}
</style>
<meta content="noindex, nofollow, noarchive" name="robots"/></head>
<body>
<main class="page">
<a aria-label="Back to Home" href="index.html" id="home"></a>
<section class="card">
<h1>Forgot Password</h1>
<p class="sub">Enter your email and we’ll send you a secure password reset link.</p>
<form id="forgotForm">
<div class="field"><input autocomplete="email" id="forgotEmail" placeholder="Email" required="" type="email"/></div>
<button class="primary" type="submit">Send Reset Link</button>
</form>
<div class="links"><a href="am-offer-net-sign-in-v1.html"><b>Back to Log in</b></a></div>
</section>
</main>
<div aria-live="polite" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="am-offer-auth-v1.js"></script>
<script src="am-offer-message-indicator-v138.js"></script>
<script>
(function(){
  const toast=document.getElementById('toast');
  function showToast(m,ms=5000){toast.textContent=m;toast.style.display='block';clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.style.display='none',ms);}
  document.getElementById('forgotForm').addEventListener('submit',async function(e){
    e.preventDefault();
    const email=document.getElementById('forgotEmail').value.trim();
    const btn=this.querySelector('button');
    if(!email){showToast('Enter your email.');return;}
    btn.disabled=true;const old=btn.textContent;btn.textContent='Sending…';
    try{
      const c=AmOfferAuth.client();
      const redirect=new URL('am-offer-net-reset-password-v1.html',location.href).href;
      const {error}=await c.auth.resetPasswordForEmail(email,{redirectTo:redirect});
      if(error)throw error;
      showToast('If the email matches an account, a secure reset link will be sent.');
    }catch(err){showToast(err?.message||'Unable to send the reset link.');}
    finally{btn.disabled=false;btn.textContent=old;}
  });
})();
</script>
<script src="am-offer-nav-cleanup-v138.js"></script>
</body>
</html>
